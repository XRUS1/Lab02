<!DOCTYPE html>
<html lang="en">
<head>
<title>three.js webgl - equirectangular video panorama</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<link type="text/css" rel="stylesheet" href="main.css">
<style>
body {
touch-action: none;
margin: 0;
overflow: hidden;
}
#indicador-version {
position: absolute;
top: 20px;
left: 20px;
color: #ffffff;
font-family: Arial, sans-serif;
font-size: 16px;
font-weight: bold;
background: rgba(0, 0, 0, 0.6);
padding: 10px 15px;
border-radius: 5px;
border: 1px solid rgba(255, 255, 255, 0.2);
pointer-events: none;
z-index: 9999;
}
</style>
</head>
<body>
<div id="indicador-version">Versión Passthrough para MetaQuest</div>

<!-- Import maps polyfill -->
<script async src="https://unpkg.com"></script>
<script type="importmap">
{
"imports": {
"three": "./build/three.module.js",
"three/addons/": "./jsm/"
}
}
</script>
<script type="module">
// Versión Passthrough para MetaQuest
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import Stats from 'three/addons/libs/stats.module.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let camera, scene, renderer, stats; 
let controller;
const clock = new THREE.Clock();
let mixer;

init();

function init() {
const container = document.createElement( 'div' );
document.body.appendChild( container );

scene = new THREE.Scene();

// BASE SÓLIDA: Añadimos un fondo gris oscuro para obligar al navegador a pintar los modelos
scene.background = new THREE.Color( 0x202020 );

camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 );

// ILUMINACIÓN REFORZADA: Subimos la intensidad para asegurar visibilidad en VR
scene.add( new THREE.HemisphereLight( 0xffffff, 0x444444, 3 ) );
const light = new THREE.DirectionalLight( 0xffffff, 3 );
light.position.set( 1, 1, 1 ).normalize();
scene.add( light );

// Load GLTF Model
new GLTFLoader()
.setPath( 'models/gltf/' )
.load( 'Nave.gltf', function ( gltf ) {
gltf.scene.scale.set(.003, .003, .003);
gltf.scene.position.x = -0.8;
gltf.scene.position.y = 0.3;
gltf.scene.position.z = -1.5;
scene.add( gltf.scene );
} );

// Load FBX Model and Animation
const loader = new FBXLoader();
loader.load( 'models/fbx/Lenador.fbx', function ( object ) {
mixer = new THREE.AnimationMixer( object );
const action = mixer.clipAction( object.animations[ 4 ] ); // Mantenemos tu animación exacta
action.play();
object.traverse( function ( child ) {
if ( child.isMesh ) {
child.castShadow = true;
child.receiveShadow = true;
}
} );
object.scale.set(.004, .004, .004);
object.position.x = 0.8;
object.position.y = -0.5;
object.position.z = -1.5;
scene.add( object );
} );

// RENDEREADOR OPTIMIZADO PARA SUAVIZADO Y ALTO RENDIMIENTO
renderer = new THREE.WebGLRenderer( { antialias: true, powerPreference: "high-performance" } );
renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.xr.enabled = true;
container.appendChild( renderer.domElement );

stats = new Stats();
container.appendChild( stats.dom );

// Botón de VR Estándar
document.body.appendChild( VRButton.createButton( renderer ) );

window.addEventListener( 'resize', onWindowResize );
}

function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize( window.innerWidth, window.innerHeight );
}

function animate() {
const delta = clock.getDelta();
if ( mixer ) mixer.update( delta );
stats.update();
render();
}

renderer.setAnimationLoop( animate );

function render() {
renderer.render( scene, camera );
}
</script>
</body>
</html>
